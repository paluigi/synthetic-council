# Inference configuration: endpoints and model roles.
#
# Providers and models are chosen HERE, never in code. API keys stay in
# .env.local under the names given by `api_key_env` — nothing secret is
# checked in. Roles may carry any sampling parameters (temperature,
# top_p, max_tokens, retries) and an `api` selector; they flow to the API
# call and into every experiment archive (payload.json settings block,
# messages.jsonl events).

[endpoints.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# decision models (Clef) are served on the alpha decisions endpoint, not
# chat/completions — live-verified: OpenRouter answers 400 otherwise
decisions_url = "https://openrouter.ai/api/alpha/decisions"

[endpoints.featherless]
base_url = "https://api.featherless.ai/v1"
api_key_env = "FEATHERLESS_API_KEY"

[endpoints.together]
base_url = "https://api.together.ai/v1"
api_key_env = "TOGETHER_API_KEY"

[endpoints.ollama]
base_url = "https://ollama.com/v1"
api_key_env = "OLLAMA_API_KEY"

# Agent statements, memo speech sections, decision-mode evidence
# curation, profile synthesis.
[roles.generator]
endpoint = "ollama"
model = "minimax-m3.1-flash"
temperature = 0.7
# free tier on Ollama Cloud (probed 2026-10-21): 6 concurrent connections
# allowed but processing is SERIAL per key (~75-90 tok/s aggregate decode,
# measured: 6 real round-1 calls finished in a 28->203s staircase). Hidden
# interleaved thinking cannot be fully disabled on pipeline prompts —
# plain and effort=low burn the whole budget on reasoning with EMPTY
# content (finish=length, probed on exact replicas); effort=none keeps it
# bounded (round-1 out ~1800-4800, finish=stop, full content, no <think>
# pollution). 6000 gives headroom over the observed 4776 max. Keep retries
# high so the 2..256 s backoff absorbs the instant-429s past 6 connections.
reasoning_effort = "none"
max_tokens = 6000
retries = 8

