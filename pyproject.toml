[project]
name = "synthetic-council"
version = "0.1.0"
description = "Agent-based simulations of the ECB Governing Council for interest rate decisions"
authors = [{ name = "Luigi Palumbo" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "jinja2>=3.1",
    "fastexcel>=0.21.0",
    "ai[vercel]>=0.7.0 ; python_full_version >= '3.12'",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_council"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
